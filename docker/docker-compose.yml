services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    # Telegram credentials for the workflow Telegram nodes ({{$env.TELEGRAM_*}})
    # are loaded from docker/.env (gitignored). Copy docker/.env.example → docker/.env
    # and fill in your values. Without it, the daily Telegram summary will fail.
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - ~/.n8n:/home/node/.n8n
    restart: unless-stopped
